name: Check version

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run version check
        run: npm run check:version
